services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY=http://api:8000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm --prefix frontend install --no-audit --no-fund && exec npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "3000:5173"
    restart: on-failure
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-ec", "npm --prefix backend install --no-audit --no-fund && exec node backend/server.js"]
    environment:
      - NODE_ENV=development
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
